<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>

    <!-- Google Fonts: Playfair Display (headings) + Inter (body) + IBM Plex Mono (code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- daisyUI components + themes (prebuilt CSS) then Tailwind Play CDN for utilities -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- htmx + SSE extension + Alpine -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }

        body { font-family: 'Inter', system-ui, sans-serif; }
        .serif { font-family: 'Playfair Display', serif !important; }

        /* Chat pane container (htmx swaps topbar + messages + input in here) */
        #chat-view { flex: 1; min-height: 0; display: flex; flex-direction: column; }

        /* Raw tokens land here before the final markdown render — keep their line
           breaks instead of collapsing the reply into one blob of text */
        .stream-tokens { white-space: pre-wrap; }

        /* Streaming cursor shown while tokens arrive (hidden while the thinking dots show) */
        .stream-cursor { display: inline-block; width: 0.5ch; animation: blink 1s step-start infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        .assistant-content:has(.thinking) .stream-cursor { display: none; }

        /* Message entrance: fade + slide up */
        .chat { animation: msg-in 0.28s ease both; }
        @keyframes msg-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

        /* Button press feedback */
        .btn { transition: transform 0.08s ease, background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
        .btn:active { transform: scale(0.96); }

        /* htmx in-flight: fade the conversation item being opened */
        .conversation-item.htmx-request { opacity: 0.55; }

        /* Assistant markdown (no typography plugin — colors inherit from the bubble) */
        .assistant-content :where(h1, h2, h3) { font-weight: 600; line-height: 1.3; margin: 0.6em 0 0.3em; }
        .assistant-content h1 { font-size: 1.35em; }
        .assistant-content h2 { font-size: 1.2em; }
        .assistant-content h3 { font-size: 1.05em; }
        .assistant-content p { margin: 0.5em 0; }
        .assistant-content p:first-child { margin-top: 0; }
        .assistant-content p:last-child { margin-bottom: 0; }
        .assistant-content ul { list-style: disc; margin: 0.5em 0 0.5em 1.25em; }
        .assistant-content ol { list-style: decimal; margin: 0.5em 0 0.5em 1.25em; }
        .assistant-content li { margin: 0.2em 0; }
        .assistant-content a { text-decoration: underline; }
        .assistant-content code { font-family: 'IBM Plex Mono', monospace; font-size: 0.85em; background: hsl(0 0% 50% / 0.18); padding: 0.1em 0.35em; border-radius: 0.25rem; }
        .assistant-content pre { background: hsl(0 0% 50% / 0.14); padding: 0.8em 1em; border-radius: 0.5rem; overflow-x: auto; margin: 0.6em 0; }
        .assistant-content pre code { background: none; padding: 0; }

        /* Thin scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: hsl(0 0% 50% / 0.3); border-radius: 99px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
        }
    </style>
</head>
<body class="bg-base-100 text-base-content overflow-hidden h-screen">

<!-- ════════════════════════ LOADING SCREEN ════════════════════════ -->
<div id="loading-screen" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center gap-4 bg-base-100">
    <span class="loading loading-spinner loading-md text-base-content/50"></span>
    <p id="loading-text" class="text-sm text-base-content/60">Initializing session…</p>
</div>

<!-- ════════════════════════ APP SHELL ════════════════════════════ -->
<div id="app-container" x-data="chat()" class="grid-cols-[260px_1fr] h-screen w-screen" style="display:none;">

    <!-- ── SIDEBAR ── -->
    <aside class="flex flex-col h-screen bg-base-200 border-r border-base-300 overflow-hidden">
        <div class="p-3 flex flex-col gap-1">
            <button class="btn btn-sm btn-ghost justify-start gap-2 font-normal" @click="newChat()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                New Chat
            </button>
            <button class="btn btn-sm btn-ghost justify-start gap-2 font-normal">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                Search
            </button>
            <button class="btn btn-sm btn-ghost justify-start gap-2 font-normal">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
                Settings
            </button>
        </div>

        <div class="px-3 pt-4 pb-1 text-xs font-semibold uppercase tracking-wide text-base-content/50">Chats</div>

        <!-- Conversation list: htmx loads this once Clerk is ready -->
        <div class="flex-1 overflow-y-auto px-2 pb-2" id="conversations-list"></div>

        <div class="p-3 border-t border-base-300 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0">
                <div id="user-button"></div>
                <span id="username-display" class="text-sm font-medium text-base-content/80 truncate"></span>
            </div>
            <button class="btn btn-ghost btn-sm btn-circle" title="Toggle theme" @click="toggleTheme()">
                <svg x-show="theme === 'dark'" x-transition.opacity.duration.200ms width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg x-show="theme === 'light'" x-cloak x-transition.opacity.duration.200ms width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </button>
        </div>
    </aside>

    <!-- ── MAIN PANE ── -->
    <main class="flex flex-col h-screen overflow-hidden bg-base-100">

        <!-- WELCOME STATE (shown when no conversation is active) -->
        <div id="welcome-view" x-show="!activeId" x-transition.opacity.duration.250ms class="flex-1 flex flex-col items-center justify-center p-6 text-center">
            <p class="serif text-4xl text-base-content mb-1">Hey <em id="welcome-name" class="italic text-base-content/70">there</em>,</p>
            <p class="serif text-2xl text-base-content/60 mb-8">What can I help you with today?</p>

            <!-- Suggestion pills -->
            <div class="flex flex-wrap gap-2 justify-center max-w-lg mb-8">
                <button class="btn btn-sm btn-outline rounded-full gap-1 font-normal" @click="suggest('Explain a concept: ')">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                    Learn
                </button>
                <button class="btn btn-sm btn-outline rounded-full gap-1 font-normal" @click="suggest('Help me build ')">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                    Build
                </button>
                <button class="btn btn-sm btn-outline rounded-full gap-1 font-normal" @click="suggest('Give me advice on ')">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    Get advice
                </button>
                <button class="btn btn-sm btn-outline rounded-full gap-1 font-normal" @click="suggest('Write ')">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    Write
                </button>
                <button class="btn btn-sm btn-outline rounded-full gap-1 font-normal" @click="suggest('Research about ')">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    Research
                </button>
            </div>

            <!-- WELCOME input: creates a new conversation from the first message -->
            <form id="welcome-form"
                  class="w-full max-w-xl flex items-end gap-2 rounded-2xl border border-base-300 bg-base-200 p-2 focus-within:border-primary transition-colors"
                  hx-post="/api/conversations/start/"
                  hx-target="#chat-view" hx-swap="innerHTML"
                  hx-on::after-request="if(event.detail.successful){ this.reset(); this.querySelector('textarea').style.height='auto'; }">
                <textarea id="welcome-input" name="content" class="autosize textarea textarea-ghost flex-1 resize-none min-h-[40px] max-h-40 bg-transparent focus:outline-none px-2" rows="1" placeholder="Ask anything…" required></textarea>
                <button type="submit" class="btn btn-primary btn-sm btn-circle">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                </button>
            </form>
        </div>

        <!-- CHAT STATE: htmx swaps the pane (topbar + messages + input) in here -->
        <div id="chat-view" x-show="activeId" x-cloak></div>

    </main>
</div>

<!-- ════════════════════════ SCRIPTS ════════════════════════════════ -->
<script>
    /* ══ ALPINE SHELL COMPONENT ══════════════════════════════════
       Owns local UI state: which conversation is active (drives the
       welcome ↔ chat view) and the theme. Server interactions are htmx. */
    function chat() {
        return {
            activeId: null,
            theme: 'dark',
            init() {
                this.theme = localStorage.getItem('theme') || 'dark';
                document.documentElement.dataset.theme = this.theme;
                /* The server tells us which conversation became active (select or start). */
                window.addEventListener('conversation-active', (e) => {
                    this.activeId = e.detail.id;
                    window.currentActiveId = e.detail.id;
                    highlightActive();
                });
                window.addEventListener('go-welcome', () => this.newChat());
            },
            toggleTheme() {
                this.theme = this.theme === 'dark' ? 'light' : 'dark';
                document.documentElement.dataset.theme = this.theme;
                localStorage.setItem('theme', this.theme);
            },
            suggest(text) {
                const i = document.getElementById('welcome-input');
                i.value = text; i.focus(); autosize(i);
            },
            newChat() {
                this.activeId = null;
                window.currentActiveId = null;
                document.getElementById('chat-view').innerHTML = '';
                highlightActive();
                this.$nextTick(() => document.getElementById('welcome-input')?.focus());
            },
        };
    }

    /* ══ GLOBAL HELPERS (shared by Alpine + delegated handlers) ══ */
    window.currentActiveId = null;

    function autosize(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

    function scrollMessages() {
        const c = document.getElementById('messages-container');
        if (c) c.scrollTop = c.scrollHeight;
    }

    /* Active conversation gets a daisyUI base-300 highlight */
    function highlightActive() {
        document.querySelectorAll('.conversation-item').forEach(el => {
            el.classList.toggle('bg-base-300', String(el.dataset.id) === String(window.currentActiveId));
        });
    }

    /* ── Conversation actions popover (rename / delete), styled with daisyUI ── */
    let currentPopover = null;
    function closePopover() {
        if (currentPopover) { currentPopover.remove(); currentPopover = null; document.removeEventListener('click', closePopover); }
    }
    function showChatMenu(button) {
        closePopover();
        const id = button.dataset.id, title = button.dataset.title;
        const pop = document.createElement('div');
        pop.className = 'fixed z-50 w-32 rounded-box border border-base-300 bg-base-100 shadow-lg p-1 flex flex-col';

        const rename = document.createElement('button');
        rename.className = 'flex items-center gap-2 rounded-md px-2 py-1.5 text-sm hover:bg-base-200 w-full text-left';
        rename.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> Rename';
        rename.onclick = (e) => { e.stopPropagation(); closePopover(); renameChat(id, title); };

        const del = document.createElement('button');
        del.className = 'flex items-center gap-2 rounded-md px-2 py-1.5 text-sm text-error hover:bg-error/10 w-full text-left';
        del.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg> Delete';
        del.onclick = (e) => { e.stopPropagation(); closePopover(); deleteChat(id); };

        pop.append(rename, del);
        document.body.appendChild(pop);
        currentPopover = pop;

        /* position: fixed → viewport-relative coordinates from the button */
        const r = button.getBoundingClientRect();
        pop.style.top = (r.bottom + 4) + 'px';
        pop.style.left = Math.max(8, r.right - 128) + 'px';
        setTimeout(() => document.addEventListener('click', closePopover), 0);
    }

    function renameChat(id, oldTitle) {
        const t = prompt('Rename chat:', oldTitle);
        if (t === null) return;
        const title = t.trim();
        if (!title || title === oldTitle) return;
        htmx.ajax('PUT', `/api/conversations/${id}/`, { values: { title }, target: '#conversations-list', swap: 'innerHTML' });
    }

    function deleteChat(id) {
        if (!confirm('Delete this chat?')) return;
        htmx.ajax('DELETE', `/api/conversations/${id}/`, { target: '#conversations-list', swap: 'innerHTML' })
            .then(() => { if (String(window.currentActiveId) === String(id)) window.dispatchEvent(new CustomEvent('go-welcome')); });
    }

    /* ══ DELEGATED EVENTS (work for htmx-swapped content) ══ */
    document.addEventListener('click', (e) => {
        const btn = e.target.closest('.chat-actions-btn');
        if (btn) { e.stopPropagation(); e.preventDefault(); showChatMenu(btn); }
    });
    document.addEventListener('input', (e) => {
        if (e.target.matches('textarea.autosize')) autosize(e.target);
    });
    document.addEventListener('keydown', (e) => {
        if (e.target.matches('textarea.autosize') && e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            e.target.closest('form').requestSubmit();
        }
    });

    /* Autoscroll + re-highlight after htmx swaps and SSE token events */
    document.body.addEventListener('htmx:afterSwap', (e) => {
        if (e.target && e.target.id === 'conversations-list') highlightActive();
        /* First streamed token arrived → drop the "thinking" dots for that bubble */
        if (e.target && e.target.classList && e.target.classList.contains('stream-tokens')) {
            e.target.parentElement.querySelector('.thinking')?.remove();
        }
        scrollMessages();
    });
    document.body.addEventListener('htmx:sseMessage', scrollMessages);

    /* ══ LOAD CLERK ══════════════════════════════════════════════ */
    (function () {
        const publishableKey = "{{ CLERK_PUBLISHABLE_KEY }}";
        if (!publishableKey || publishableKey.startsWith('{{')) {
            showError('CLERK_PUBLISHABLE_KEY is missing from your .env file.');
            return;
        }
        try {
            const domain = atob(publishableKey.split('_')[2]).slice(0, -1);
            const s = document.createElement('script');
            s.setAttribute('data-clerk-publishable-key', publishableKey);
            s.async = true;
            s.src = `https://${domain}/npm/@clerk/clerk-js@4/dist/clerk.browser.js`;
            s.crossOrigin = 'anonymous';
            s.addEventListener('load', initializeClerk);
            s.addEventListener('error', () => showError(`Failed to load Clerk script from ${domain}`));
            document.body.appendChild(s);
        } catch (e) {
            showError('Clerk Publishable Key format is invalid.');
        }
    })();

    async function initializeClerk() {
        try {
            await window.Clerk.load();
            if (!window.Clerk.user) {
                document.getElementById('loading-text').innerText = 'Redirecting to sign in…';
                window.Clerk.redirectToSignIn();
                return;
            }
            /* mount Clerk user button */
            window.Clerk.mountUserButton(document.getElementById('user-button'));

            /* welcome name */
            const firstName = window.Clerk.user.firstName || window.Clerk.user.username || '';
            document.getElementById('username-display').innerText = firstName;
            document.getElementById('welcome-name').innerText = firstName || 'there';

            /* show app */
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('app-container').style.display = 'grid';

            /* load the sidebar list now that the Clerk session cookie is fresh */
            htmx.ajax('GET', '/api/conversations/partial/', { target: '#conversations-list', swap: 'innerHTML' });
        } catch (err) {
            showError(err.message || 'Clerk failed to initialize.');
        }
    }

    /* ══ ERROR HELPER ════════════════════════════════════════ */
    function showError(msg) {
        const spinner = document.getElementById('loading-screen').querySelector('.loading');
        const text    = document.getElementById('loading-text');
        if (spinner) spinner.style.display = 'none';
        if (text)    text.innerHTML = `<span class="text-error font-semibold">Error</span><br><span class="text-xs">${msg}</span>`;
    }
</script>

</body>
</html>
