{% comment %}One stored message. Assistant content is pre-rendered markdown HTML.{% endcomment %}
{% if message.role == 'user' %}
<div class="chat chat-end max-w-3xl mx-auto w-full px-4">
    <div class="chat-bubble chat-bubble-primary">{{ message.content }}</div>
</div>
{% else %}
<div class="chat chat-start max-w-3xl mx-auto w-full px-4">
    <div class="chat-image">
        <div class="w-8 h-8 rounded-full bg-primary/20 text-primary flex items-center justify-center">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
    </div>
    <div class="chat-bubble assistant-content">{{ message.content_html|safe }}</div>
</div>
{% endif %}
