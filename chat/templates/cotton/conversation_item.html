<c-vars c active_id />
<div class="conversation-item group flex items-center gap-1 rounded-lg px-3 py-2 text-sm cursor-pointer transition-colors hover:bg-base-300{% if c.id == active_id %} bg-secondary/15 text-secondary{% endif %}"
     data-id="{{ c.id }}"
     hx-get="/api/conversations/{{ c.id }}/pane/" hx-target="#chat-view" hx-swap="innerHTML">
    <span class="chat-title-span flex-1 truncate">{{ c.title }}</span>
    <button type="button" class="chat-actions-btn btn btn-ghost btn-xs btn-circle opacity-0 group-hover:opacity-100"
            data-id="{{ c.id }}" data-title="{{ c.title }}" aria-label="Chat actions">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
    </button>
</div>
